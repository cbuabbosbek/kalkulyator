<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Racing Game</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #111;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .game {
        width: 350px;
        height: 600px;
        background: #333;
        position: relative;
        overflow: hidden;
        border: 5px solid white;
        border-radius: 12px;
      }

      .road {
        width: 100%;
        height: 100%;
        background: #444;
        position: absolute;
      }

      .line {
        position: absolute;
        width: 8px;
        height: 80px;
        background: white;
        left: 50%;
        transform: translateX(-50%);
      }

      .player,
      .enemy {
        width: 45px;
        height: 80px;
        position: absolute;
        border-radius: 10px;
        bottom: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 25px;
      }

      .player {
        background: dodgerblue;
        left: 150px;
      }

      .enemy {
        background: crimson;
      }

      .score {
        position: absolute;
        top: 15px;
        left: 15px;
        color: white;
        font-size: 22px;
        z-index: 5;
      }

      .game-over {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        z-index: 10;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }

      button {
        padding: 12px 25px;
        background: #00c853;
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 18px;
        cursor: pointer;
      }

      .controls {
        position: absolute;
        bottom: 15px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-around;
        z-index: 6;
      }

      .controls button {
        background: #222;
        font-size: 25px;
        width: 65px;
        padding: 10px;
      }
    </style>
  </head>

  <body>
    <div class="game" id="game">
      <div class="road" id="road"></div>

      <div class="score">Ball: <span id="score">0</span></div>

      <div class="player" id="player">🚙</div>

      <div class="game-over" id="gameOver">
        <h1>GAME OVER!</h1>
        <h2>Ball: <span id="finalScore">0</span></h2>
        <button onclick="restartGame()">Qayta boshlash</button>
      </div>

      <div class="controls">
        <button id="left">⬅️</button>
        <button id="right">➡️</button>
      </div>
    </div>

    <script>
      const game = document.getElementById("game");
      const player = document.getElementById("player");
      const road = document.getElementById("road");

      let playerX = 150;
      let score = 0;
      let speed = 5;
      let enemies = [];
      let lines = [];
      let gameRunning = true;

      // Yo'l chiziqlari
      for (let i = 0; i < 7; i++) {
        let line = document.createElement("div");
        line.className = "line";
        line.style.top = i * 100 + "px";
        road.appendChild(line);
        lines.push(line);
      }

      // Dushman mashinalar
      function createEnemy() {
        const enemy = document.createElement("div");
        enemy.className = "enemy";
        enemy.innerHTML = "🚗";

        let x = Math.floor(Math.random() * 280);
        enemy.style.left = x + "px";
        enemy.style.top = "-100px";

        game.appendChild(enemy);
        enemies.push(enemy);
      }

      // Mashina boshqaruvi
      function moveLeft() {
        if (playerX > 10) {
          playerX -= 25;
          player.style.left = playerX + "px";
        }
      }

      function moveRight() {
        if (playerX < 285) {
          playerX += 25;
          player.style.left = playerX + "px";
        }
      }

      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowLeft") moveLeft();
        if (e.key === "ArrowRight") moveRight();
      });

      document.getElementById("left").addEventListener("click", moveLeft);
      document.getElementById("right").addEventListener("click", moveRight);

      // To'qnashuv
      function collision(a, b) {
        let r1 = a.getBoundingClientRect();
        let r2 = b.getBoundingClientRect();

        return !(
          r1.bottom < r2.top ||
          r1.top > r2.bottom ||
          r1.right < r2.left ||
          r1.left > r2.right
        );
      }

      // O'yin tugashi
      function endGame() {
        gameRunning = false;

        document.getElementById("finalScore").innerText = score;
        document.getElementById("gameOver").style.display = "flex";
      }

      // Asosiy o'yin
      let lastEnemy = 0;

      function gameLoop() {
        if (!gameRunning) return;

        // Yo'l harakati
        lines.forEach((line) => {
          let y = parseInt(line.style.top);
          y += speed;

          if (y > 600) y = -80;

          line.style.top = y + "px";
        });

        // Dushmanlarni yaratish
        lastEnemy++;

        if (lastEnemy > 65) {
          createEnemy();
          lastEnemy = 0;
        }

        // Dushman mashinalar harakati
        enemies.forEach((enemy, index) => {
          let y = parseInt(enemy.style.top);
          y += speed;

          enemy.style.top = y + "px";

          if (collision(player, enemy)) {
            endGame();
          }

          if (y > 650) {
            enemy.remove();
            enemies.splice(index, 1);

            score++;
            document.getElementById("score").innerText = score;

            if (score % 5 === 0) {
              speed += 0.5;
            }
          }
        });

        if (gameRunning) {
          requestAnimationFrame(gameLoop);
        }
      }

      gameLoop();
    </script>
  </body>
</html>
